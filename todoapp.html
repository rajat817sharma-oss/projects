<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        #cont{
            text-align: center;
            margin-block:1rem;
        }
        .taskclass{
            margin-inline:2rem;
        }
        #btn1{
            height:20px;
            width:60px;
            background-color: green;
            color:white;
            border:0;
            border-radius: 10px;
        }
        #btn1:hover{
            background-color: rgb(73, 173, 73);
        }
        #taskname{
            margin-block:2rem;
            margin-inline:2rem;
        }
        .summ{
            margin-block:2rem;
            margin-inline:2rem;
        }
        .acp{
            margin-block:2rem;
            margin-inline:2rem;
            display: flex;
            gap:5rem;
        }
        .acp button{
            height:20px;
            width:120px;
            font-size: 1rem;
            border-radius: 10px;
            border:0;
        }
        #acpall{
            background-color: green;
            color:white
        }
        #acpcomp{
            background-color: green;
            color:white
        }
        #acppen{
            background-color: red;
            color:white
        }
        #clr{
            height:20px;
            width:120px;
            font-size: 1rem;
            border-radius: 10px;
            border:0;
            background-color: red;
            color:white;
            margin-block:2rem;
            margin-inline:2rem;
        }
    </style>
</head>
<body>
    <p id="cont">My Todo App</p>
    <div class="taskclass"> 
    <input type="text" id="task" placeholder="enter your task here">
    <button ID="btn1">ADD</button>
    </div>
    <p id="taskname">your tasks name</p>
    <div class="summ">
    <span id="total">Total tasks</span> <br>
    <span id="comp">Completed tasks</span> <br>
    <span id="pen">Pending tasks</span> <br>
    </div>
    <div class="acp">
        <button id="acpall">ALL</button>
        <button id="acpcomp">COMPLETED</button>
        <button id="acppen">PENDING</button>
    </div>
    <button id="clr">Clear all</button>
</body>
<script>
    let count=0;
    document.getElementById("btn1").addEventListener("click",()=>{
    count++;
    let taskname=document.getElementById("task").value;
    let newrow=document.createElement('div');
    newrow.style.marginBlock="1rem";
    let chk=document.createElement('input');
    chk.type="checkbox";
    let spn=document.createElement('span');
    spn.style.marginInline=".5rem";
    let del=document.createElement('button');
    del.innerText="DEL";
    del.style.height="20px";
    del.style.width="60px";
    del.style.backgroundColor="red";
    del.style.color="white";
    del.style.border="0";
    del.style.borderRadius="10px";
    del.style.marginInline="1rem";
    let edit=document.createElement('button');
    edit.innerText="EDIT";
    edit.style.height="20px";
    edit.style.width="60px";
    edit.style.backgroundColor="green";
    edit.style.color="white";
    edit.style.border="0";
    edit.style.borderRadius="10px";
    edit.style.marginInline="1rem";
    spn.innerHTML=taskname;
    document.getElementById("taskname").appendChild(newrow);
    newrow.appendChild(chk);
    newrow.appendChild(spn);
    newrow.appendChild(del);
    newrow.appendChild(edit);
    let fun=()=>{
        let totalchk=document.querySelectorAll(`input[type="checkbox"]`)
        let completed=0;
        totalchk.forEach((box)=>{
            if(box.checked){
                completed++;
            }
        })
    let total=totalchk.length;
    let pending=total-completed;
    document.getElementById("total").innerHTML=("total tasks:"+total);
    document.getElementById("comp").innerHTML=("completed tasks:"+completed);
    document.getElementById("pen").innerHTML=("pending tasks:"+pending);
}
    fun();
    del.addEventListener("click",()=>{
        newrow.remove()
        fun();
    })
    edit.addEventListener("click",()=>{
        if(spn.isContentEditable){
            edit.innerText="EDIT";
            spn.contentEditable=false;
        }
        else{
        edit.innerText="save";
        spn.contentEditable=true;
        }
    })
    chk.addEventListener("change",()=>{
            fun();
            })
        document.getElementById("acpall").addEventListener("click",()=>{
            let ttldiv=document.querySelectorAll("#taskname div");
            ttldiv.forEach((box)=>{
                box.style.display="block";
            })
        })
        document.getElementById("acpcomp").addEventListener("click",()=>{
            let ttldiv=document.querySelectorAll("#taskname div");
            ttldiv.forEach((chkbox)=>{
                let chk=chkbox.querySelector(`input[type="checkbox"]`);
                    if(chk.checked){
                        chkbox.style.display="block"
                    }
                    else{
                        chkbox.style.display="none";
                    }
            })
        })
        document.getElementById("acppen").addEventListener("click",()=>{
            let ttldiv=document.querySelectorAll("#taskname div");
            ttldiv.forEach((chkbox)=>{
                let chk=chkbox.querySelector(`input[type="checkbox"]`);
                    if(!chk.checked){
                        chkbox.style.display="block"
                    }
                    else{
                        chkbox.style.display="none";
                    }
            })
        })
    document.getElementById("task").value="";
    document.getElementById("clr").addEventListener("click",()=>{
        document.getElementById("taskname").innerHTML="";
        fun();
    })
    })
</script>
</html>
