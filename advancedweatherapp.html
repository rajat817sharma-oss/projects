<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            font-family: sans-serif;
            box-sizing: border-box;
        }
        .body-bdr{
            height:100vh;
            width:100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app-bdr{
            min-height: 200px;
            width:600px;
            background-color: blue;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 30px;
            gap:2rem
        }
        #app-name{
            height:60px;
            width:100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            font-size: 3rem;
            color:white;
            margin-block:2rem;
        }
        #app-name p svg{
            color:black;
        }
        #input-div{
            height:60px;
            width:100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        #city-name{
            height:50px;
            width:70%;
            border-top-left-radius: 25px;
            border-bottom-left-radius: 25px;
            border-top-right-radius: 25px;
            border-bottom-right-radius: 25px;
            padding-left: 2rem;
            border:0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        #search-div{
            height:50px;
            width:50px;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }
        #image{
            width:100%;
            font-size: 9rem;
            text-align: center;
            color:yellow;
        }
        #temp{
            font-size: 4rem;
            color:white;
            text-align: center;
        }
        #city{
            font-size: 3rem;
            color:white;
            text-align: center;
        }
        #bottom-div{
            height:60px;
            width:100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap:6rem;
            margin-block:3rem;
        }
        #div1{
            height:100%;
            width:50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color:white;
            font-size: 2rem;
            gap:1.5rem
        }
        #div1 p svg{
            font-size: 4rem;
        }
        #div2{
            height:100%;
            width:50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color:white;
            font-size: 2rem;
            gap:1.5rem;
        }
        #div2 p svg{
            font-size: 4rem;
        }
        #mis{
            color:red;
            font-size: 3rem;
        }
        
    </style>
</head>
<body>
    <div class="body-bdr">
        <div id="app-bdr">
            <div id="app-name">
                <p>Weather app <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
	<path d="M0 0h24v24H0z" fill="none" />

</svg></p>
            </div>
            <div id="input-div">
                <input type="text" id="city-name" placeholder="Enter city name">
                <div id="search-div">
                    <svg xmlns="https://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 15 15">
	<path d="M0 0h15v15H0z" fill="none" />
	<path fill="currentColor" d="M6 0a6.005 6.005 0 0 1 4.89 9.48l3.82 3.81c.39.39.39 1.03 0 1.42s-1.03.39-1.42 0l-3.81-3.82A6.005 6.005 0 0 1 0 6c0-3.31 2.69-6 6-6m0 2C3.79 2 2 3.79 2 6s1.79 4 4 4s4-1.79 4-4s-1.79-4-4-4" />
</svg>
                </div>
            </div>
            <p id="mis"></p>
            <div id="output">

        </div>
        </div>
    </div>
</body>
<script>
    let user=document.querySelector("#city-name");
    let clicker=document.querySelector("#search-div");
    let result=document.querySelector("#output")
    let mistake=document.querySelector("#mis")
    clicker.addEventListener("click",async()=>{
    try{
        let ipt=user.value.trim();
        if(ipt==""){
            alert("Enter city name first")
            result.innerHTML="";
            mistake.innerHTML="";
            return;
        }
        let response= await fetch(`https://api.weatherapi.com/v1/current.json?key=9a967e19fd384cd692a133218261506&q=${ipt}&aqi=yes`)
        if(!response.ok){
            mistake.innerHTML="404 DATA NOT FOUND"
            result.innerHTML="";
            return;
        }
        mistake.innerHTML="";
        let data=await response.json();
        let image=data.current.condition.text;
        result.innerHTML=`
        <p id=image></p>
        <p id=temp>${data.current.temp_c}°C</p>
        <p id=city>${data.location.name},${data.location.country}</p>
        <div id=bottom-div>
            <div id=div1>
                <p id=humi-img1><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 32 32">

</svg>
</p>
                <div id=div1-p>

                    <p>Humidity</p>
                </div>
            </div>

            <div id=div2>

	<path d="M0 0h24v24H0z" fill="none" />

</svg>
</p>
                <div id=div2-p>
                    <p>${data.current.wind_kph}k/h</p>
                    <p>Wind</p>
                </div>
            </div>
        </div>
        `

        if(image=="Sunny"){
           outimg.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
